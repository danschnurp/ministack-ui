version: "3.8"
name: Ministack

services:
  ministack:
    image: ministackorg/ministack
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  streamlit-ui:
    build:
      context: ../streamlit_app
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - LOCALSTACK_ENDPOINT=http://ministack:4566
    depends_on:
      - "ministack"

  react-ui:
    build:
      context: ../js_node
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - VITE_API_BASE=/api
      - VITE_AWS_REGION=us-east-1
    depends_on:
      - "ministack"
