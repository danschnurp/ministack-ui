version: "3.8"

services:
  ministack:
    image: ministackorg/ministack
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  streamlit-ui:
    build:
      context: ../streamlit_app
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - LOCALSTACK_ENDPOINT=http://ministack:4566
    depends_on:
      - ministack



